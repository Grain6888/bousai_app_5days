{% extends "base.html" %}

{% block title %}避難所検索{% endblock %}

{% block content %}
<style>
    .shelter-search-page {
        width: min(100% - 40px, 980px);
        margin: 0 auto;
        padding: 20px 0 30px;
    }

    .search-layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 28px;
        align-items: start;
    }

    .search-controls {
        min-width: 0;
    }

    .search-controls h1 {
        margin: 0 0 16px;
        color: #111;
        font-size: 20px;
        font-weight: 700;
    }

    .search-form {
        display: grid;
        gap: 14px;
    }

    .field-label,
    .unknown-label {
        color: #111;
        font-size: 15px;
        font-weight: 700;
    }

    .shelter-select,
    .address-input {
        width: 216px;
        height: 40px;
        border: 1px solid #aeb5bb;
        border-radius: 0;
        background: #fff;
        color: #111;
        padding: 0 10px;
        font: inherit;
    }

    .unknown-option {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .unknown-checkbox {
        width: 16px;
        height: 16px;
        margin: 0;
    }

    .address-fields {
        display: grid;
        gap: 8px;
    }

    .address-fields[hidden],
    .search-error[hidden] {
        display: none;
    }

    .location-button,
    .search-button {
        width: 136px;
        height: 38px;
        border: 1px solid #aeb5bb;
        border-radius: 0;
        background: #d7eef9;
        color: #111;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    .location-button {
        background: #fff;
    }

    .search-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
    }

    .search-error {
        width: max(158px, 100%);
        border: 1px solid #c33;
        background: #fff;
        color: #c00;
        padding: 5px 7px;
        font-size: 12px;
        line-height: 1.35;
    }

    .map-placeholder {
        position: relative;
        min-height: 320px;
        overflow: hidden;
        border: 1px solid #d5d9dd;
        background: #e8eef0;
    }

    #searchMap {
        width: 100%;
        height: 100%;
        min-height: 320px;
    }

    .map-instruction {
        position: absolute;
        z-index: 500;
        top: 10px;
        left: 50%;
        width: max-content;
        max-width: calc(100% - 20px);
        transform: translateX(-50%);
        padding: 6px 10px;
        border: 1px solid #aeb5bb;
        background: rgba(255, 255, 255, 0.92);
        color: #111;
        font-size: 13px;
        text-align: center;
    }

    .map-legend {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 500;
        display: grid;
        gap: 4px;
        padding: 8px 10px;
        border: 1px solid #111;
        background: rgba(255, 255, 255, 0.92);
        color: #111;
        font-size: 12px;
        line-height: 1.3;
        pointer-events: none;
    }

    .map-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }

    .map-legend-color {
        width: 11px;
        height: 11px;
        border: 1px solid #111;
        border-radius: 50%;
    }

    .map-legend-open { background: #1677d2; }
    .map-legend-temporary-closed { background: #e5b400; }
    .map-legend-closed { background: #d93636; }

    .map-fallback {
        display: flex;
        min-height: 320px;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #fff;
        color: #444;
        text-align: center;
    }

    .map-fallback[hidden] {
        display: none;
    }

    .map-placeholder strong {
        position: absolute;
        z-index: 501;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        background: rgba(255, 255, 255, 0.9);
        color: #111;
        font-size: 18px;
    }

    .map-placeholder>span {
        display: none;
    }

    .home-return {
        display: flex;
        width: 150px;
        min-height: 46px;
        margin: 28px 0 0 auto;
        align-items: center;
        justify-content: center;
        border: 2px solid #111;
        border-radius: 5px;
        background: #bdeafa;
        color: #111;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
    }

    .home-return:hover,
    .home-return:focus-visible {
        background: #9fdef2;
    }

    @media (max-width: 700px) {
        .shelter-search-page {
            width: min(100% - 20px, 520px);
            padding-top: 12px;
        }

        .search-layout {
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .shelter-select,
        .address-input {
            width: 100%;
        }

        .search-actions {
            flex-wrap: wrap;
        }

        .search-error {
            flex: 1 1 158px;
        }

        .home-return {
            margin-top: 20px;
        }
    }
</style>

<div class="shelter-search-page">
    <div class="search-layout">
        <section class="search-controls" aria-labelledby="search-heading">
            <h1 id="search-heading">避難所名</h1>
            <form id="shelter-search-form" class="search-form" method="get" action="/search_results" novalidate>
                <label class="field-label" for="shelter-name">避難所名</label>
                <select id="shelter-name" class="shelter-select" name="name">
                    <option value="">▼ 選択してください</option>
                    {% for shelter in shelters or [] %}
                    {% if shelter.name is defined %}
                    <option value="{{ shelter.name }}">{{ shelter.name }}</option>
                    {% endif %}
                    {% endfor %}
                </select>

                <label class="unknown-option unknown-label" for="shelter-unknown">
                    <input id="shelter-unknown" class="unknown-checkbox" type="checkbox">
                    避難所が分からない
                </label>

                <div id="address-fields" class="address-fields" hidden>
                    <label class="field-label" for="shelter-address">住所</label>
                    <button id="get-current-location" class="location-button" type="button">現在地を取得</button>
                    <input id="shelter-address" class="address-input" name="address" type="text" placeholder="現在の住所">
                </div>
                <input id="shelter-latitude" name="latitude" type="hidden">
                <input id="shelter-longitude" name="longitude" type="hidden">

                <div class="search-actions">
                    <button id="shelter-search-submit" class="search-button" type="submit">検索</button>
                    <div id="search-error" class="search-error" aria-live="polite" hidden></div>
                </div>
            </form>
        </section>

        <section class="map-placeholder" aria-label="地図表示エリア">
            <div id="searchMap"></div>
            <div class="map-instruction">地図上の場所を選択してください</div>
            <div class="map-legend" aria-label="マップの凡例">
                <div class="map-legend-item"><span class="map-legend-color map-legend-open"></span>避難所（開設）</div>
                <div class="map-legend-item"><span class="map-legend-color map-legend-temporary-closed"></span>避難所（一時的に閉鎖）</div>
                <div class="map-legend-item"><span class="map-legend-color map-legend-closed"></span>避難所（閉鎖）</div>
            </div>
            <div class="map-fallback" hidden>地図を読み込めません。避難所名または住所で検索できます。</div>
        </section>
    </div>

    <a class="home-return" href="/">ホームに戻る</a>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    .shelter-map-pin {
        width: 26px;
        height: 26px;
        border: 2px solid #fff;
        border-radius: 50% 50% 50% 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        transform: rotate(-45deg);
    }

    .shelter-map-pin::after {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        margin: 7px auto;
        border-radius: 50%;
        background: #fff;
    }

    .shelter-map-pin-open {
        background: #1677d2;
    }

    .shelter-map-pin-temporary-closed {
        background: #e5b400;
    }

    .shelter-map-pin-closed {
        background: #d93636;
    }
</style>
<script id="shelter-data" type="application/json">{{ shelters|tojson }}</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('shelter-search-form');
        const shelterName = document.getElementById('shelter-name');
        const unknown = document.getElementById('shelter-unknown');
        const addressFields = document.getElementById('address-fields');
        const address = document.getElementById('shelter-address');
        const locationButton = document.getElementById('get-current-location');
        const error = document.getElementById('search-error');
        const latitude = document.getElementById('shelter-latitude');
        const longitude = document.getElementById('shelter-longitude');
        const shelterDataElement = document.getElementById('shelter-data');
        const shelters = shelterDataElement ? JSON.parse(shelterDataElement.textContent) : [];
        let marker = null;

        function shelterIcon(status) {
            const statusClass = status === '開設'
                ? 'shelter-map-pin-open'
                : status === '一時的に閉鎖' || status === '一時封鎖'
                    ? 'shelter-map-pin-temporary-closed'
                    : 'shelter-map-pin-closed';
            return L.divIcon({
                className: '',
                html: '<div class="shelter-map-pin ' + statusClass + '"></div>',
                iconSize: [26, 36],
                iconAnchor: [13, 36],
                popupAnchor: [0, -30]
            });
        }

        if (typeof L !== 'undefined') {
            const map = L.map('searchMap', {
                scrollWheelZoom: true,
                doubleClickZoom: true,
                boxZoom: false,
                keyboard: false,
                touchZoom: true
            }).setView([40.8244, 140.7400], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const shelterBounds = [];
            shelters.forEach(function (shelter) {
                const shelterLatitude = Number.parseFloat(shelter.latitude);
                const shelterLongitude = Number.parseFloat(shelter.longitude);
                if (!Number.isFinite(shelterLatitude) || !Number.isFinite(shelterLongitude)) return;

                const shelterMarker = L.marker(
                    [shelterLatitude, shelterLongitude],
                    { icon: shelterIcon(shelter.status) }
                ).addTo(map);
                shelterMarker.bindPopup(shelter.name || '避難所');
                shelterMarker.on('click', function () {
                    shelterName.value = shelter.name || '';
                    unknown.checked = false;
                    addressFields.hidden = true;
                    address.value = '';
                    latitude.value = shelterLatitude.toFixed(5);
                    longitude.value = shelterLongitude.toFixed(5);
                    clearError();
                });
                shelterBounds.push([shelterLatitude, shelterLongitude]);
            });
            if (shelterBounds.length > 0) {
                map.fitBounds(shelterBounds, { padding: [20, 20], maxZoom: 14 });
            }

            map.on('click', function (event) {
                const selectedLatitude = event.latlng.lat.toFixed(5);
                const selectedLongitude = event.latlng.lng.toFixed(5);
                latitude.value = selectedLatitude;
                longitude.value = selectedLongitude;
                if (marker) marker.setLatLng(event.latlng);
                else marker = L.marker(event.latlng).addTo(map);
                address.value = '住所を取得中...';
                reverseGeocode(selectedLatitude, selectedLongitude)
                    .then(function (result) {
                        address.value = result.address;
                        clearError();
                    })
                    .catch(function (geocodeError) {
                        address.value = '';
                        showError(geocodeError.message);
                    });
            });
        } else {
            document.getElementById('searchMap').hidden = true;
            document.querySelector('.map-instruction').hidden = true;
            document.querySelector('.map-fallback').hidden = false;
        }

        function showError(message) {
            error.textContent = message;
            error.hidden = false;
        }

        function clearError() {
            error.textContent = '';
            error.hidden = true;
        }

        function reverseGeocode(selectedLatitude, selectedLongitude) {
            return fetch('/api/reverse_geocode?latitude=' + encodeURIComponent(selectedLatitude)
                + '&longitude=' + encodeURIComponent(selectedLongitude))
                .then(function (response) {
                    return response.json().then(function (data) {
                        if (!response.ok) throw new Error(data.error || '住所を取得できませんでした。');
                        return data;
                    });
                });
        }

        unknown.addEventListener('change', function () {
            clearError();
            addressFields.hidden = !unknown.checked;
            if (!unknown.checked) {
                address.value = '';
                latitude.value = '';
                longitude.value = '';
            }
        });

        form.addEventListener('submit', function (event) {
            clearError();
            if (!unknown.checked && !shelterName.value && (!latitude.value || !longitude.value)) {
                event.preventDefault();
                showError('避難所を選択してください。');
            } else if (unknown.checked && !address.value.trim() && !latitude.value && !longitude.value) {
                event.preventDefault();
                showError('住所を入力してください。');
            }
        });

        locationButton.addEventListener('click', function () {
            if (!navigator.geolocation) {
                showError('現在地を取得できません。');
                return;
            }

            locationButton.disabled = true;
            locationButton.textContent = '住所を取得中...';
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const currentLatitude = position.coords.latitude.toFixed(5);
                    const currentLongitude = position.coords.longitude.toFixed(5);
                    latitude.value = currentLatitude;
                    longitude.value = currentLongitude;

                    reverseGeocode(currentLatitude, currentLongitude)
                        .then(function (result) {
                            address.value = result.address;
                            clearError();
                        })
                        .catch(function (fetchError) {
                            address.value = '';
                            showError(fetchError.message);
                        })
                        .finally(function () {
                            locationButton.disabled = false;
                            locationButton.textContent = '現在地を取得';
                        });
                },
                function () {
                    locationButton.disabled = false;
                    locationButton.textContent = '現在地を取得';
                    showError('現在地を取得できません。');
                }
            );
        });
    });
</script>
{% endblock %}
