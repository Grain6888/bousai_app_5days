{% extends "base.html" %}

{% block title %}避難所検索{% endblock %}

{% block content %}
<style>
    .shelter-search-page {
        width: min(100% - 40px, 980px);
        margin: 0 auto;
        padding: 20px 0 30px;
    }

    .search-layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 28px;
        align-items: start;
    }

    .search-controls {
        min-width: 0;
    }

    .search-controls h1 {
        margin: 0 0 16px;
        color: #111;
        font-size: 20px;
        font-weight: 700;
    }

    .search-form {
        display: grid;
        gap: 14px;
    }

    .field-label,
    .unknown-label {
        color: #111;
        font-size: 15px;
        font-weight: 700;
    }

    .shelter-select,
    .address-input {
        width: 216px;
        height: 40px;
        border: 1px solid #aeb5bb;
        border-radius: 0;
        background: #fff;
        color: #111;
        padding: 0 10px;
        font: inherit;
    }

    .unknown-option {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .unknown-checkbox {
        width: 16px;
        height: 16px;
        margin: 0;
    }

    .address-fields {
        display: grid;
        gap: 8px;
    }

    .address-fields[hidden],
    .search-error[hidden] {
        display: none;
    }

    .location-button,
    .search-button {
        width: 136px;
        height: 38px;
        border: 1px solid #aeb5bb;
        border-radius: 0;
        background: #d7eef9;
        color: #111;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    .location-button {
        background: #fff;
    }

    .search-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
    }

    .search-error {
        width: max(158px, 100%);
        border: 1px solid #c33;
        background: #fff;
        color: #c00;
        padding: 5px 7px;
        font-size: 12px;
        line-height: 1.35;
    }

    .map-placeholder {
        position: relative;
        min-height: 239px;
        overflow: hidden;
        border: 1px solid #d5d9dd;
        background: #e8eef0;
    }

    #searchMap {
        width: 100%;
        height: 100%;
        min-height: 239px;
    }

    .map-instruction {
        position: absolute;
        z-index: 500;
        top: 10px;
        left: 50%;
        width: max-content;
        max-width: calc(100% - 20px);
        transform: translateX(-50%);
        padding: 6px 10px;
        border: 1px solid #aeb5bb;
        background: rgba(255, 255, 255, 0.92);
        color: #111;
        font-size: 13px;
        text-align: center;
    }

    .map-fallback {
        display: flex;
        min-height: 239px;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #fff;
        color: #444;
        text-align: center;
    }

    .map-fallback[hidden] {
        display: none;
    }

    .map-placeholder strong {
        position: absolute;
        z-index: 501;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        background: rgba(255, 255, 255, 0.9);
        color: #111;
        font-size: 18px;
    }

    .map-placeholder>span {
        display: none;
    }

    .home-return {
        display: block;
        width: fit-content;
        margin: 28px 0 0 auto;
        color: #111;
        font-size: 15px;
        font-weight: 700;
    }

    @media (max-width: 700px) {
        .shelter-search-page {
            width: min(100% - 20px, 520px);
            padding-top: 12px;
        }

        .search-layout {
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .shelter-select,
        .address-input {
            width: 100%;
        }

        .search-actions {
            flex-wrap: wrap;
        }

        .search-error {
            flex: 1 1 158px;
        }

        .home-return {
            margin-top: 20px;
        }
    }
</style>

<div class="shelter-search-page">
    <div class="search-layout">
        <section class="search-controls" aria-labelledby="search-heading">
            <h1 id="search-heading">避難所名</h1>
            <form id="shelter-search-form" class="search-form" method="get" action="/search_results" novalidate>
                <label class="field-label" for="shelter-name">避難所名</label>
                <select id="shelter-name" class="shelter-select" name="name">
                    <option value="">▼ 選択してください</option>
                    {% for shelter in shelters or [] %}
                    {% if shelter.name is defined %}
                    <option value="{{ shelter.name }}">{{ shelter.name }}</option>
                    {% endif %}
                    {% endfor %}
                </select>

                <label class="unknown-option unknown-label" for="shelter-unknown">
                    <input id="shelter-unknown" class="unknown-checkbox" type="checkbox">
                    避難所が分からない
                </label>

                <div id="address-fields" class="address-fields" hidden>
                    <label class="field-label" for="shelter-address">住所</label>
                    <button id="get-current-location" class="location-button" type="button">現在地を取得</button>
                    <input id="shelter-address" class="address-input" name="address" type="text" placeholder="現在の住所">
                </div>
                <input id="shelter-latitude" name="latitude" type="hidden">
                <input id="shelter-longitude" name="longitude" type="hidden">

                <div class="search-actions">
                    <button id="shelter-search-submit" class="search-button" type="submit">検索</button>
                    <div id="search-error" class="search-error" aria-live="polite" hidden></div>
                </div>
            </form>
        </section>

        <section class="map-placeholder" aria-label="地図表示エリア">
            <div id="searchMap"></div>
            <div class="map-instruction">地図上の場所を選択してください</div>
            <strong>マップ</strong>
            <div class="map-fallback" hidden>地図を読み込めません。避難所名または住所で検索できます。</div>
        </section>
    </div>

    <a class="home-return" href="/">ホームに戻る</a>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('shelter-search-form');
        const shelterName = document.getElementById('shelter-name');
        const unknown = document.getElementById('shelter-unknown');
        const addressFields = document.getElementById('address-fields');
        const address = document.getElementById('shelter-address');
        const locationButton = document.getElementById('get-current-location');
        const error = document.getElementById('search-error');
        const latitude = document.getElementById('shelter-latitude');
        const longitude = document.getElementById('shelter-longitude');
        let marker = null;

        if (typeof L !== 'undefined') {
            const map = L.map('searchMap', {
                scrollWheelZoom: false,
                doubleClickZoom: false,
                boxZoom: false,
                keyboard: false,
                touchZoom: false
            }).setView([40.8244, 140.7400], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            map.on('click', function (event) {
                latitude.value = event.latlng.lat.toFixed(5);
                longitude.value = event.latlng.lng.toFixed(5);
                if (marker) marker.setLatLng(event.latlng);
                else marker = L.marker(event.latlng).addTo(map);
                clearError();
            });
        } else {
            document.getElementById('searchMap').hidden = true;
            document.querySelector('.map-instruction').hidden = true;
            document.querySelector('.map-fallback').hidden = false;
        }

        function showError(message) {
            error.textContent = message;
            error.hidden = false;
        }

        function clearError() {
            error.textContent = '';
            error.hidden = true;
        }

        unknown.addEventListener('change', function () {
            clearError();
            addressFields.hidden = !unknown.checked;
            if (!unknown.checked) {
                address.value = '';
                latitude.value = '';
                longitude.value = '';
            }
        });

        form.addEventListener('submit', function (event) {
            clearError();
            if (!unknown.checked && !shelterName.value && (!latitude.value || !longitude.value)) {
                event.preventDefault();
                showError('避難所を選択してください。');
            } else if (unknown.checked && !address.value.trim() && !latitude.value && !longitude.value) {
                event.preventDefault();
                showError('住所を入力してください。');
            }
        });

        locationButton.addEventListener('click', function () {
            if (!navigator.geolocation) {
                showError('現在地を取得できません。');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const currentLatitude = position.coords.latitude.toFixed(5);
                    const currentLongitude = position.coords.longitude.toFixed(5);
                    address.value = currentLatitude + ', ' + currentLongitude;
                    latitude.value = currentLatitude;
                    longitude.value = currentLongitude;
                    clearError();
                },
                function () {
                    showError('現在地を取得できません。');
                }
            );
        });
    });
</script>
{% endblock %}
