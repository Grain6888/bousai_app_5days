<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --header-bg: #0d3d75;
      --header-bg-deep: #083866;
      --page-bg: #eef1f4;
      --card-bg: #f4f5f7;
      --panel-bg: #f8f9fa;
      --border: #d7dce2;
      --text: #1f2d3d;
      --muted: #5f6d7b;
      --green: #2f9c67;
      --green-soft: #dff5ea;
      --blue: #1f6bb9;
      --shadow: rgba(15, 35, 57, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic Pro", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      height: 76px;
      background: linear-gradient(180deg, var(--header-bg) 0%, var(--header-bg-deep) 100%);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.08);
    }

    .topbar-inner {
      max-width: 1040px;
      height: 100%;
      margin: 0 auto;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f9fcff;
    }

    .menu-button {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      padding: 0;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .menu-button span {
      display: block;
      width: 22px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255,255,255,0.95);
    }

    .page-main {
      max-width: 980px;
      margin: 26px auto 0;
      padding: 0 10px 40px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 1px 0 var(--shadow);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      color: #1d2e43;
      font-weight: 700;
    }

    .map-panel {
      padding: 18px 18px 16px;
      background: #f3f4f5;
    }

    .location-pin {
      font-size: 1.15rem;
      transform: translateY(-1px);
    }

    .map-shell {
      width: 100%;
      height: 410px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(137, 149, 169, 0.45);
      background: #dfe9ee;
    }

    #shelterMap {
      width: 100%;
      height: 100%;
    }

    .weather-panel {
      margin-top: 30px;
      background: #f3f4f5;
      padding: 18px 20px 18px;
    }

    .weather-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .weather-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1d2e43;
    }

    .refresh-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(52, 143, 90, 0.4);
      background: rgba(52, 161, 101, 0.12);
      color: #2f9c67;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .refresh-badge::before {
      content: "◌";
      display: inline-block;
      font-size: 0.9rem;
      color: #2f9c67;
      transform: translateY(-1px);
    }

    .weather-content {
      padding-top: 4px;
    }

    .city-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 8px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1f2d3d;
    }

    .city-row .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #7a8696;
      background: #f4f8fc;
      display: inline-block;
      box-shadow: inset 0 0 0 1px rgba(67, 72, 78, 0.1);
    }

    .status-good {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #2a9a5d;
      font-weight: 700;
      margin: 8px 0 16px;
      font-size: 1.05rem;
    }

    .status-good .checkmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2f9c67;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .meta-list {
      display: grid;
      gap: 8px;
      color: #53657a;
      font-size: 0.96rem;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.5;
    }

    .meta-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      color: #5a7ba7;
      font-size: 0.82rem;
      opacity: 0.9;
    }

    @media (max-width: 640px) {
      .weather-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .refresh-badge {
        font-size: 0.8rem;
      }

      .map-shell {
        height: 310px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">防災アプリ</h1>
      <button class="menu-button" aria-label="メニュー">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main class="page-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
