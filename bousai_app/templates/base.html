<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --header-bg: #edf0f3;
      --header-text: #111111;
      --page-bg: #edf0f3;
      --card-bg: #f8f9fb;
      --card-border: #dfe6ee;
      --muted-text: #5d7287;
      --heading-text: #0a3f66;
      --primary-blue: #1c6cf2;
      --success: #2fba7a;
      --shadow: 0 2px 10px rgba(14, 35, 52, 0.08);
      --header-line: #111111;
      --nav-button-bg: #c9eefc;
      --nav-button-border: #111111;
      --nav-button-text: #111111;
      --white-bg: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--page-bg);
      color: #1d2a38;
    }

    body {
      min-height: 100vh;
    }

    .app-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-line);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 18px 12px 16px;
      position: relative;
      z-index: 10;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .system-name,
    .page-name {
      margin: 0;
      color: #111111;
      text-align: left;
      line-height: 1.2;
    }

    .system-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .page-name {
      margin-top: 2px;
      font-size: 16px;
      font-weight: 600;
    }

    .nav-drawer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      margin-left: auto;
    }

    .nav-button,
    .text-button {
      appearance: none;
      border: 2px solid var(--nav-button-border);
      border-radius: 4px;
      background: var(--nav-button-bg);
      color: var(--nav-button-text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      min-height: 38px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .nav-button:hover,
    .text-button:hover {
      opacity: 0.92;
    }

    .text-button {
      background: transparent;
      border: none;
      padding: 0 4px;
      min-height: unset;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .nav-dropdown {
      position: relative;
    }

    .dropdown-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 180px;
      background: var(--white-bg);
      border: 2px solid var(--nav-button-border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      z-index: 20;
    }

    .dropdown-panel[hidden] {
      display: none;
    }

    .dropdown-option {
      display: block;
      width: 100%;
      text-align: left;
      border: 2px solid var(--nav-button-border);
      background: var(--nav-button-bg);
      color: var(--nav-button-text);
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .admin-panel {
      min-width: 210px;
      right: 0;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 0 48px;
    }

    .page-shell {
      width: min(100%, 820px);
      margin: 0 auto;
    }

    .page-main {
      max-width: 980px;
      margin: 26px auto 0;
      padding: 0 10px 40px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 1px 0 rgba(15, 35, 57, 0.08);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      color: #1d2e43;
      font-weight: 700;
    }

    .map-panel {
      padding: 18px 18px 16px;
      background: #f3f4f5;
    }

    .location-pin {
      font-size: 1.15rem;
      transform: translateY(-1px);
    }

    .map-shell {
      width: 100%;
      height: 410px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(137, 149, 169, 0.45);
      background: #dfe9ee;
    }

    #shelterMap {
      width: 100%;
      height: 100%;
    }

    .weather-panel {
      margin-top: 30px;
      background: #f3f4f5;
      padding: 18px 20px 18px;
    }

    .weather-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .weather-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1d2e43;
    }

    .refresh-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(52, 143, 90, 0.4);
      background: rgba(52, 161, 101, 0.12);
      color: #2f9c67;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .refresh-badge::before {
      content: "◌";
      display: inline-block;
      font-size: 0.9rem;
      color: #2f9c67;
      transform: translateY(-1px);
    }

    .weather-content {
      padding-top: 4px;
    }

    .city-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 8px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1f2d3d;
    }

    .city-row .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #7a8696;
      background: #f4f8fc;
      display: inline-block;
      box-shadow: inset 0 0 0 1px rgba(67, 72, 78, 0.1);
    }

    .status-good,
    .status-alert {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      margin: 8px 0 16px;
      font-size: 1.05rem;
    }

    .status-good {
      color: #2a9a5d;
    }

    .status-alert {
      color: #b65000;
    }

    .checkmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2f9c67;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .status-alert .checkmark {
      background: #d67a1d;
    }

    .meta-list {
      display: grid;
      gap: 8px;
      color: #53657a;
      font-size: 0.96rem;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.5;
    }

    .meta-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      color: #5a7ba7;
      font-size: 0.82rem;
      opacity: 0.9;
    }

    .warning-list {
      margin: 0 0 16px 1.2rem;
      padding: 0;
      color: #2d3d4d;
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .weather-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .refresh-badge {
        font-size: 0.8rem;
      }

      .map-shell {
        height: 310px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header" role="banner">
    <div class="header-left">
      <p class="system-name">志賀野市防災システム</p>
      <p class="page-name">{% block page_title %}{{ self.title()|replace(' - 防災アプリ', '') }}{% endblock %}</p>
    </div>

    <nav class="nav-drawer" aria-label="メニュー">
      <a href="/" class="nav-button">ホーム</a>
      <a href="/shelter_search" class="nav-button">避難所検索</a>

      <div class="nav-dropdown">
        <button class="text-button" type="button" aria-expanded="false" aria-controls="font-size-menu" data-toggle="target" data-target="font-size-menu">
          ▼ 文字の大きさの変更
        </button>
        <div class="dropdown-panel" id="font-size-menu" hidden>
          <button class="dropdown-option" type="button">小</button>
          <button class="dropdown-option" type="button">標準</button>
          <button class="dropdown-option" type="button">大</button>
        </div>
      </div>

      <div class="nav-dropdown">
        <button class="text-button" type="button" aria-expanded="false" aria-controls="admin-menu" data-toggle="target" data-target="admin-menu">
          ▼ 管理者向けメニュー
        </button>
        <div class="dropdown-panel admin-panel" id="admin-menu" hidden>
          <a href="{% if session.logged_in %}/logout{% else %}/login{% endif %}" class="nav-button">{% if session.logged_in %}ログアウト{% else %}ログイン{% endif %}</a>
          <a href="/shelter_register" class="nav-button">避難所登録</a>
          <a href="/board" class="nav-button">指示ボード</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const toggles = document.querySelectorAll('[data-toggle="target"]');
      const panels = document.querySelectorAll('.dropdown-panel');

      toggles.forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          const targetId = this.getAttribute('data-target');
          const target = document.getElementById(targetId);
          if (!target) return;

          const shouldOpen = target.hidden;

          panels.forEach(function (panel) {
            if (panel !== target) {
              panel.hidden = true;
            }
          });

          toggles.forEach(function (toggle) {
            if (toggle !== button) {
              toggle.setAttribute('aria-expanded', 'false');
            }
          });

          target.hidden = !shouldOpen;
          this.setAttribute('aria-expanded', String(shouldOpen));
        });
      });

      document.addEventListener('click', function (event) {
        if (!event.target.closest('[data-toggle="target"]')) {
          panels.forEach(function (panel) {
            panel.hidden = true;
          });

          toggles.forEach(function (button) {
            button.setAttribute('aria-expanded', 'false');
          });
        }
      });
    });
  </script>
</body>
</html>
