{% extends "base.html" %}

{% block content %}
<section class="card map-panel">
  <h2 class="panel-title"><span class="location-pin">📍</span>避難所マップ</h2>
  <div class="map-shell">
    <div id="shelterMap" aria-label="避難所マップ"></div>
  </div>
</section>

<section class="card weather-panel">
  <div class="weather-header">
    <h2 class="weather-title"><span>🌧️</span>青森市 気象警報・注意報</h2>
    <div class="refresh-badge">10分おき自動更新</div>
  </div>

  <div id="weatherContent" class="weather-content">
    <div class="city-row"><span class="dot"></span>青森市</div>
    <div class="status-good"><span class="checkmark">✓</span>現在、警報・注意報は発表されていません</div>
    <div class="meta-list">
      <div class="meta-item"><span class="meta-icon">◔</span>データ取得時刻: 2025年06月05日 11:56</div>
      <div class="meta-item"><span class="meta-icon">☁</span>気象庁発表: 2025年06月04日 21:08</div>
    </div>
  </div>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');
        const areaName = (data && data.area_name) || '青森市';
        const warnings = (data && Array.isArray(data.warnings)) ? data.warnings : [];

        if (data && data.error) {
            weatherContent.innerHTML = `
                <div class="city-row"><span class="dot"></span>${areaName}</div>
                <div class="status-good"><span class="checkmark">✓</span>現在、警報・注意報は発表されていません</div>
                <div class="meta-list">
                  <div class="meta-item"><span class="meta-icon">◔</span>データ取得時刻: ${data.last_fetch_time || '更新中...'}</div>
                  <div class="meta-item"><span class="meta-icon">☁</span>気象庁発表: ${data.report_time || '不明'}</div>
                </div>
            `;
            return;
        }

        const hasWarning = warnings.length > 0;
        const warningHtml = hasWarning ? warnings.map(w => `
            <li>${w.name}${w.status ? `（${w.status}）` : ''}</li>
        `).join('') : '';

        weatherContent.innerHTML = `
            <div class="city-row"><span class="dot"></span>${areaName}</div>
            <div class="${hasWarning ? 'status-alert' : 'status-good'}">
                <span class="checkmark">${hasWarning ? '⚠' : '✓'}</span>
                ${hasWarning ? '警報・注意報が発表されています' : '現在、警報・注意報は発表されていません'}
            </div>
            ${hasWarning ? `<ul class="warning-list">${warningHtml}</ul>` : ''}
            <div class="meta-list">
              <div class="meta-item"><span class="meta-icon">◔</span>データ取得時刻: ${(data && data.last_fetch_time) || '更新中...'}</div>
              <div class="meta-item"><span class="meta-icon">☁</span>気象庁発表: ${(data && data.report_time) || '不明'}</div>
            </div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
